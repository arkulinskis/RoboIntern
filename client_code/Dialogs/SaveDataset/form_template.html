<div class="ui ri-dlg">
  <h2 class="dlg-h">Save the data description</h2>
  <p class="muted">Column names, types, roles and task settings. No values.</p>
  <div class="ui-stack">
    <label class="ui-field"><span>Name</span>
      <anvil-component type="TextBox" name="name_box"></anvil-component>
    </label>
    <anvil-component type="CheckBox" name="overwrite_box" prop:checked="true" prop:visible="false"></anvil-component>
    <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
    <div class="ui-row end">
      <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
      <anvil-component type="Button" name="save_button" prop:text="Save" prop:role='["btn", "btn-primary"]'></anvil-component>
    </div>
  </div>
</div>
