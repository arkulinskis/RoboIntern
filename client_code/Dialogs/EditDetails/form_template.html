<div class="ui ri-dlg">
  <h2 class="dlg-h">Edit details</h2>
  <div class="ui-stack">
    <label class="ui-field"><span>Title</span>
      <anvil-component type="TextBox" name="title_box"></anvil-component>
    </label>
    <label class="ui-field"><span>Notes</span>
      <anvil-component type="TextArea" name="notes_box" prop:height="120"></anvil-component>
    </label>
    <label class="ui-field"><span>Tags <em>(comma-separated)</em></span>
      <anvil-component type="TextBox" name="tags_box"></anvil-component>
    </label>
    <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
    <div class="ui-row end">
      <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
      <anvil-component type="Button" name="save_button" prop:text="Save" prop:role='["btn", "btn-primary"]'></anvil-component>
    </div>
  </div>
</div>
