<div class="ui ri-dlg">
  <h2 class="dlg-h">Save to your notebook</h2>
  <p class="muted">The listing keeps its data description, so you can reopen it in the Lab later. Only column names, types and roles are stored, never your data.</p>
  <div class="ui-stack">
    <label class="ui-field"><span>Title</span>
      <anvil-component type="TextBox" name="title_box"></anvil-component>
    </label>
    <label class="ui-field"><span>Notes <em>(optional)</em></span>
      <anvil-component type="TextArea" name="notes_box" prop:placeholder="What this is for, what you changed, results…" prop:height="100"></anvil-component>
    </label>
    <label class="ui-field"><span>Tags <em>(comma-separated, optional)</em></span>
      <anvil-component type="TextBox" name="tags_box" prop:placeholder="retail, daily"></anvil-component>
    </label>
    <anvil-component type="CheckBox" name="public_box" prop:text="Share it in the Commons (others see the title, notes, columns and code, with your name)"></anvil-component>
    <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
    <div class="ui-row end">
      <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
      <anvil-component type="Button" name="save_button" prop:text="Save" prop:role='["btn", "btn-primary", "ic-save"]'></anvil-component>
    </div>
  </div>
</div>
