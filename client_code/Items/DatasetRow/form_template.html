<div class="ui-item nb-ds-row">

    <anvil-component type="Label" name="name" prop:role='["nb-ds-name"]' bind:text="self.item['name']"></anvil-component>
    <anvil-component type="Label" name="line" prop:role='["fine-print"]'></anvil-component>
  </div>
  <anvil-component type="Button" name="open_button" prop:text="Open in the Lab" prop:role='["btn", "btn-sm", "btn-icon", "ic-flask"]' prop:tooltip="Open in the Lab"></anvil-component>
  <anvil-component type="Button" name="delete_button" prop:text="Delete" prop:role='["btn", "btn-sm", "btn-ghost", "btn-danger", "btn-icon", "ic-trash"]' prop:tooltip="Delete"></anvil-component>
</div>
